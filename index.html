<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Два гения 🍻</title>

<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow-x: hidden;
    font-family: 'Caveat', cursive;
    color: white;
    background: linear-gradient(135deg, #8f75d6, #c58bdc, #f2a6c8, #a9a5eb);
    background-size: 300% 300%;
    animation: gradient 12s ease infinite;
}

.container {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 25px;
    position: relative;
    z-index: 2;
}

h1 {
    font-size: clamp(45px, 8vw, 75px);
    margin: 0 0 10px;
    text-shadow: 2px 3px 10px #7955a4;
}

.subtitle {
    font-size: 27px;
    margin-bottom: 15px;
}

.scene {
    width: 100%;
    max-width: 550px;
    height: 300px;
    position: relative;
}

.person {
    position: absolute;
    width: 150px;
    height: 240px;
    top: 20px;
}

.person.left {
    left: 8%;
}

.person.right {
    right: 8%;
}

.head {
    width: 90px;
    height: 90px;
    background: #ffe2c6;
    border: 4px solid #59436f;
    border-radius: 50%;
    position: absolute;
    left: 30px;
    top: 0;
    z-index: 2;
}

.eye {
    position: absolute;
    width: 7px;
    height: 12px;
    background: #59436f;
    border-radius: 50%;
    top: 35px;
}

.eye.one {
    left: 25px;
}

.eye.two {
    right: 25px;
}

.smile {
    position: absolute;
    width: 25px;
    height: 12px;
    border-bottom: 3px solid #59436f;
    border-radius: 50%;
    left: 29px;
    top: 52px;
}

.body-person {
    position: absolute;
    width: 7px;
    height: 85px;
    background: #59436f;
    left: 72px;
    top: 87px;
    border-radius: 10px;
}

.arm {
    position: absolute;
    width: 65px;
    height: 6px;
    background: #59436f;
    top: 112px;
    left: 72px;
    transform: rotate(-25deg);
    transform-origin: left;
    border-radius: 10px;
}

.arm.other {
    transform: rotate(45deg);
}

.leg {
    position: absolute;
    width: 75px;
    height: 6px;
    background: #59436f;
    top: 168px;
    left: 72px;
    transform: rotate(35deg);
    border-radius: 10px;
}

.leg.other {
    transform: rotate(-35deg);
}

.beer {
    position: absolute;
    width: 42px;
    height: 53px;
    background: linear-gradient(90deg, #e99b24, #ffcf54, #e99b24);
    border: 3px solid #694a45;
    border-radius: 5px 5px 10px 10px;
    top: 103px;
    left: 125px;
    z-index: 4;
    transform: rotate(-15deg);
    transition: transform 0.3s;
}

.beer::before {
    content: "";
    position: absolute;
    width: 20px;
    height: 13px;
    background: white;
    border-radius: 50%;
    top: -10px;
    left: 7px;
}

.beer::after {
    content: "";
    position: absolute;
    width: 13px;
    height: 24px;
    border: 4px solid #694a45;
    border-left: none;
    border-radius: 0 12px 12px 0;
    right: -15px;
    top: 7px;
}

.right .beer {
    left: -15px;
    transform: rotate(15deg);
}

.scene.cheers .left .beer {
    transform: translateX(30px) rotate(10deg);
}

.scene.cheers .right .beer {
    transform: translateX(-30px) rotate(-10deg);
}

button {
    border: none;
    padding: 17px 30px;
    border-radius: 40px;
    background: #fff0cc;
    color: #7955a4;
    font-family: 'Comfortaa', sans-serif;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 7px 20px #684a8b55;
}

button:hover {
    transform: scale(1.08);
    background: white;
}

.message {
    font-size: 30px;
    min-height: 75px;
    max-width: 550px;
    margin-top: 20px;
}
</style>
</head>
<body>
    <div class="decoration">
        <span>🍺</span>
        <span>♡</span>
        <span>✦</span>
        <span>🍻</span>
       </div>

    <div class="container">
        <h1>Две дивы 🍻</h1>

<div class="subtitle">
    Один мозг на двоих. И страдания в Алексе тоже
</div>

<div class="scene" id="scene">

    <div class="person left">
        <div class="head">
            <div class="eye one"></div>
            <div class="eye two"></div>
            <div class="smile"></div>
        </div>

        <div class="body-person"></div>
        <div class="arm"></div>
        <div class="arm other"></div>
        <div class="leg"></div>
        <div class="leg other"></div>
        <div class="beer"></div>
    </div>

    <div class="person right">
        <div class="head">
            <div class="eye one"></div>
            <div class="eye two"></div>
            <div class="smile"></div>
        </div>

        <div class="body-person"></div>
        <div class="arm"></div>
        <div class="arm other"></div>
        <div class="leg"></div>
        <div class="leg other"></div>
        <div class="beer"></div>
    </div>

</div>

<button onclick="cheers()">
    ЧОКНУТЬСЯ КРУЖКАМИ 🍻
</button>

<div class="message" id="message">
    Нажми на кнопку. У нас тут важное мероприятие.
</div>
<style>
.decoration {
    position: fixed;
    pointer-events: none;
    inset: 0;
    overflow: hidden;
    z-index: 1;
}

.decoration span {
    position: absolute;
    animation: float 6s ease-in-out infinite;
    opacity: 0.55;
}

.decoration span:nth-child(1) {
    top: 10%;
    left: 10%;
    font-size: 40px;
}

.decoration span:nth-child(2) {
    top: 20%;
    right: 12%;
    font-size: 50px;
}

.decoration span:nth-child(3) {
    bottom: 15%;
    left: 15%;
    font-size: 45px;
}

.decoration span:nth-child(4) {
    bottom: 20%;
    right: 10%;
    font-size: 40px;
}

.bubble {
    position: fixed;
    bottom: -30px;
    z-index: 3;
    pointer-events: none;
    animation: rise 4s linear forwards;
}

@keyframes gradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

@keyframes float {
    50% {
        transform: translateY(-20px) rotate(15deg);
    }
}

@keyframes rise {
    to {
        transform: translateY(-110vh);
        opacity: 0;
    }
}

@media (max-width: 450px) {
    .person.left {
        left: 0;
    }

    .person.right {
        right: 0;
    }

    .scene {
        transform: scale(0.9);
    }
}
</style>

<script>
const jokes = [
    "За наши гениальные решения. Которые мы ещё не приняли.",
    "За дружбу, которую не испортит даже наша тупость.",
    "За все приключения, после которых мы говорим: «Больше никогда».",
    "За прекрасных людей. То есть за нас.",
    "Если мы обе неадекватные, значит, это уже норма.",
    "Две легенды. Ноль доказательств.",
    "Психолог нам дорогой, поэтому просто чокаемся.",
    "За то, чтобы поводов встретиться было больше, чем причин пожалеть."
];

let last = -1;

function cheers() {
    const scene = document.getElementById("scene");
    const message = document.getElementById("message");

    scene.classList.remove("cheers");
    void scene.offsetWidth;
    scene.classList.add("cheers");

    let random;

    do {
        random = Math.floor(Math.random() * jokes.length);
    } while (random === last);

    last = random;
    message.textContent = jokes[random];

    for (let i = 0; i < 15; i++) {
        const bubble = document.createElement("div");

        bubble.className = "bubble";
        bubble.textContent = ["♡", "✦", "🍺", "♥"][
            Math.floor(Math.random() * 4)
        ];

        bubble.style.left = Math.random() * 100 + "vw";
        bubble.style.fontSize = (20 + Math.random() * 20) + "px";

        document.body.appendChild(bubble);

        setTimeout(() => bubble.remove(), 4000);
    }

    setTimeout(() => {
        scene.classList.remove("cheers");
    }, 600);
}
</script>

</body>
</html>
